<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b5f7f"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e86f2a"/>
    </marker>
    <style>
      .title { font-family: Georgia, serif; font-size: 42px; font-weight: 700; fill: #0e5c79; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #33515c; }
      .label { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0e5c79; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #22343b; }
      .tiny { font-family: Arial, sans-serif; font-size: 12px; fill: #22343b; }
      .box { fill: #ffffff; stroke: #0b5f7f; stroke-width: 3; rx: 16; }
      .soft { fill: #f4fbfd; stroke: #8bb8c8; stroke-width: 2; rx: 12; }
      .mol { fill: #fff7ef; stroke: #e86f2a; stroke-width: 3; rx: 14; }
      .head { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
      .header { fill: #16657f; }
      .arrow { stroke: #0b5f7f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #e86f2a; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .dash { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="18" y="18" width="1564" height="864" fill="#ffffff" stroke="#d0d0d0" stroke-width="2"/>
  <text x="800" y="68" text-anchor="middle" class="title">Conditional Denoising Generator with Dynamic Molecular State</text>
  <text x="800" y="101" text-anchor="middle" class="subtitle">Frozen graph condition C + denoising state (X_t, A_t) + molecular features recomputed at every step</text>

  <!-- Left conditioning panel -->
  <rect x="55" y="135" width="320" height="650" class="box"/>
  <text x="215" y="175" text-anchor="middle" class="label">Graph-level condition</text>

  <rect x="95" y="210" width="240" height="80" class="soft"/>
  <circle cx="145" cy="250" r="16" fill="#b08bd8" stroke="#333"/>
  <circle cx="220" cy="230" r="16" fill="#8edbd0" stroke="#333"/>
  <circle cx="285" cy="265" r="16" fill="#b08bd8" stroke="#333"/>
  <line x1="160" y1="246" x2="205" y2="234" stroke="#268bd2" stroke-width="4"/>
  <line x1="235" y1="238" x2="270" y2="258" stroke="#268bd2" stroke-width="4"/>
  <text x="215" y="322" text-anchor="middle" class="small">conditioning molecule / graph G_c</text>

  <path d="M 215 345 L 215 388" class="arrow"/>
  <rect x="88" y="395" width="254" height="68" class="soft"/>
  <text x="215" y="425" text-anchor="middle" class="small">Frozen NSPPK-SVD encoder</text>
  <text x="215" y="448" text-anchor="middle" class="tiny">same 128-dim C used by Denoise and DiGress</text>

  <path d="M 215 465 L 215 508" class="arrow"/>
  <rect x="84" y="515" width="262" height="56" class="soft"/>
  <rect x="110" y="535" width="30" height="16" fill="#1f77b4"/>
  <rect x="140" y="535" width="30" height="16" fill="#2ca02c"/>
  <rect x="170" y="535" width="30" height="16" fill="#8cc63f"/>
  <rect x="200" y="535" width="30" height="16" fill="#6b4cc2"/>
  <rect x="230" y="535" width="72" height="16" fill="#d9d9d9"/>
  <text x="215" y="605" text-anchor="middle" class="label">Condition vector C</text>

  <rect x="88" y="650" width="254" height="72" class="soft"/>
  <text x="215" y="683" text-anchor="middle" class="small">Time t in [0, 1]</text>
  <text x="215" y="708" text-anchor="middle" class="small">Sinusoidal embedding e_t</text>

  <!-- Center denoising state -->
  <rect x="430" y="135" width="735" height="650" class="box"/>
  <text x="798" y="175" text-anchor="middle" class="label">Recurrent denoising step</text>

  <rect x="465" y="210" width="250" height="130" class="soft"/>
  <text x="590" y="235" text-anchor="middle" class="label">Node table X_t</text>
  <text x="590" y="263" text-anchor="middle" class="small">existence | degree | label one-hot | features</text>
  <g transform="translate(497,278)">
    <rect x="0" y="0" width="184" height="46" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="0" y="0" width="32" height="46" fill="#36b36b"/>
    <rect x="32" y="0" width="32" height="46" fill="#f7a51b"/>
    <rect x="64" y="0" width="32" height="46" fill="#8d4cc2"/>
    <rect x="96" y="0" width="88" height="46" fill="#6ca6d9"/>
    <line x1="0" y1="15" x2="184" y2="15" stroke="#aaa"/>
    <line x1="0" y1="30" x2="184" y2="30" stroke="#aaa"/>
  </g>

  <rect x="885" y="210" width="245" height="130" class="soft"/>
  <text x="1008" y="235" text-anchor="middle" class="label">Edge state A_t</text>
  <text x="1008" y="263" text-anchor="middle" class="small">joint edge probabilities</text>
  <g transform="translate(948,279)">
    <rect x="0" y="0" width="92" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="18" y1="0" x2="18" y2="50" stroke="#aaa"/>
    <line x1="36" y1="0" x2="36" y2="50" stroke="#aaa"/>
    <line x1="54" y1="0" x2="54" y2="50" stroke="#aaa"/>
    <line x1="72" y1="0" x2="72" y2="50" stroke="#aaa"/>
    <line x1="0" y1="16" x2="92" y2="16" stroke="#aaa"/>
    <line x1="0" y1="33" x2="92" y2="33" stroke="#aaa"/>
    <rect x="18" y="16" width="18" height="17" fill="#1f77b4" opacity=".85"/>
    <rect x="54" y="0" width="18" height="16" fill="#1f77b4" opacity=".55"/>
    <rect x="72" y="33" width="20" height="17" fill="#1f77b4" opacity=".75"/>
  </g>

  <path d="M 590 348 C 590 375, 650 382, 680 405" class="arrow2"/>
  <path d="M 1008 348 C 1008 375, 920 382, 875 405" class="arrow2"/>
  <rect x="635" y="395" width="320" height="118" class="mol"/>
  <text x="795" y="424" text-anchor="middle" class="label" fill="#bf541f">Dynamic molecular features m_t</text>
  <text x="795" y="452" text-anchor="middle" class="small">recomputed from current X_t and A_t</text>
  <text x="795" y="477" text-anchor="middle" class="tiny">current valency | allowed valency | valence deficit</text>
  <text x="795" y="497" text-anchor="middle" class="tiny">atom weight | graph weight summary</text>

  <path d="M 215 610 C 290 610, 360 610, 430 610" class="arrow"/>
  <path d="M 215 690 C 315 690, 355 655, 430 655" class="arrow"/>

  <path d="M 590 342 C 600 515, 595 545, 625 570" class="arrow"/>
  <path d="M 795 516 L 795 560" class="arrow2"/>

  <rect x="570" y="560" width="455" height="160" class="box"/>
  <text x="798" y="590" text-anchor="middle" class="label">Transformer denoiser</text>
  <rect x="615" y="608" width="365" height="28" fill="#dff1ff" stroke="#0aa0dd" stroke-width="2" rx="6"/>
  <text x="798" y="628" text-anchor="middle" class="tiny">node self-attention over X_t</text>
  <rect x="615" y="645" width="365" height="28" fill="#dff5df" stroke="#38a838" stroke-width="2" rx="6"/>
  <text x="798" y="665" text-anchor="middle" class="tiny">cross-attention to conditioning tokens [C, e_t]</text>
  <rect x="615" y="682" width="365" height="28" fill="#fde2fa" stroke="#b12da0" stroke-width="2" rx="6"/>
  <text x="798" y="702" text-anchor="middle" class="tiny">edge-state message passing using A_t</text>

  <path d="M 1025 640 C 1085 640, 1085 300, 1050 300" class="arrow dash"/>
  <text x="1115" y="465" class="tiny">update A_t</text>
  <path d="M 798 722 C 798 765, 1030 765, 1030 342" class="arrow dash"/>
  <text x="938" y="760" class="tiny">repeat: X_t, A_t -> X_{t-1}, A_{t-1}</text>

  <!-- Right outputs -->
  <rect x="1215" y="135" width="315" height="650" class="box"/>
  <text x="1372" y="175" text-anchor="middle" class="label">Heads and supervision</text>

  <rect x="1245" y="205" width="255" height="46" class="header"/>
  <text x="1260" y="234" class="small" fill="#fff" font-weight="700">Head / term</text>
  <text x="1390" y="234" class="small" fill="#fff" font-weight="700">Supervision</text>

  <g class="small">
    <rect x="1245" y="251" width="255" height="56" class="head"/>
    <text x="1260" y="285" fill="#0e5c79" font-weight="700">Noise / X0</text>
    <text x="1390" y="275">continuous</text><text x="1390" y="295">node-wise</text>
    <rect x="1245" y="307" width="255" height="56" class="head"/>
    <text x="1260" y="341" fill="#1b7d2d" font-weight="700">Node existence</text>
    <text x="1390" y="331">binary</text><text x="1390" y="351">node-wise</text>
    <rect x="1245" y="363" width="255" height="56" class="head"/>
    <text x="1260" y="397" fill="#e86f2a" font-weight="700">Node label</text>
    <text x="1390" y="387">categorical</text><text x="1390" y="407">node-wise</text>
    <rect x="1245" y="419" width="255" height="56" class="head"/>
    <text x="1260" y="453" fill="#a12da0" font-weight="700">Degree</text>
    <text x="1390" y="443">categorical</text><text x="1390" y="463">node-wise</text>
    <rect x="1245" y="475" width="255" height="56" class="head"/>
    <text x="1260" y="509" fill="#099bd3" font-weight="700">Edge existence</text>
    <text x="1390" y="499">pairwise</text><text x="1390" y="519">binary</text>
    <rect x="1245" y="531" width="255" height="56" class="head"/>
    <text x="1260" y="565" fill="#f2a57c" font-weight="700">Edge label</text>
    <text x="1390" y="555">categorical</text><text x="1390" y="575">pairwise</text>
    <rect x="1245" y="587" width="255" height="56" class="head"/>
    <text x="1260" y="621" fill="#e31a1c" font-weight="700">Distance</text>
    <text x="1390" y="611">categorical</text><text x="1390" y="631">pairwise</text>
    <rect x="1245" y="643" width="255" height="56" class="head"/>
    <text x="1260" y="677" fill="#777" font-weight="700">Consistency</text>
    <text x="1390" y="667">regularizer</text>
  </g>

  <path d="M 1027 640 C 1110 640, 1160 450, 1235 450" class="arrow"/>

  <!-- Final projection -->
  <rect x="1215" y="805" width="315" height="50" class="mol"/>
  <text x="1372" y="827" text-anchor="middle" class="small" font-weight="700">Final molecular valency projection</text>
  <text x="1372" y="846" text-anchor="middle" class="tiny">downgrade / prune invalid bonds after decoding</text>
  <path d="M 1372 700 L 1372 795" class="arrow2"/>

  <!-- Loss line -->
  <rect x="65" y="815" width="1085" height="46" fill="#fffdf9" stroke="#e86f2a" stroke-width="2"/>
  <text x="607" y="834" text-anchor="middle" class="small" font-weight="700">
    L = node reconstruction / existence / label / degree
  </text>
  <text x="607" y="854" text-anchor="middle" class="small" font-weight="700">
    + edge existence / edge label + distance + consistency terms
  </text>

  <text x="58" y="875" class="tiny">Key change from old diagram: the denoiser now receives current edge state A_t and dynamic molecular features m_t recomputed during the backward process.</text>
</svg>
